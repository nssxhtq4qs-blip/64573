name: build-ipa
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14          # Xcode 15/16：arm64e 是 Apple 原生支持
    steps:
      - uses: actions/checkout@v4
      - name: install ldid
        run: brew install ldid-procursus || brew install ldid
      - name: build arm64e
        run: ARCH=arm64e ./build_macos.sh
      - name: build arm64
        run: ARCH=arm64 ./build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AppDump-ipa
          path: dist/*.ipa
