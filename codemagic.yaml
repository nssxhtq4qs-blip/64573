workflows:
  arm64e:
    name: AppDump arm64e
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        ARCH: arm64e
    scripts:
      - name: install ldid
        script: brew install ldid-procursus || brew install ldid
      - name: build
        script: ARCH=arm64e ./build_macos.sh
    artifacts:
      - dist/*.ipa
